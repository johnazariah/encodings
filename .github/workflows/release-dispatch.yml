name: Prepare Release

# Trigger from GitHub UI or CLI:
#   gh workflow run release-dispatch.yml -f bump=auto
#   gh workflow run release-dispatch.yml -f bump=minor
#   gh workflow run release-dispatch.yml -f bump=current   # ship staged version, no bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (use "current" to ship the staged version with no bump)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - current
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare-release:
    # GitHub-hosted Linux so this dispatch is always schedulable on demand. No Linux
    # self-hosted runner is registered (only Windows + macOS self-hosted runners exist),
    # so the former [self-hosted, Linux, X64, buildbeast, podman, release] label set left
    # the release preparation permanently queued. Every step below uses only portable
    # POSIX tooling, git, and the shared scripts/lib/release-lib.sh helpers (which are
    # explicitly bash-3.2/Linux portable) — no podman/self-hosted-only commands.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for commit analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Analyze commits and determine version
        id: version
        run: |
          set -euo pipefail

          # Shared, portable release helpers (parity with scripts/release.sh).
          source scripts/lib/release-lib.sh

          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          FIRST_RELEASE=false
          if [[ -z "$LAST_TAG" ]]; then
            echo "::notice::No previous release found. This will be the first release."
            LAST_TAG="$(git rev-list --max-parents=0 HEAD)"
            LAST_VERSION="0.0.0"
            FIRST_RELEASE=true
          else
            LAST_VERSION="${LAST_TAG#v}"
            echo "::notice::Last release: $LAST_TAG"
          fi

          # Current version from .fsproj (portable — no PCRE `grep -oP`).
          FSPROJ="src/Encodings/Encodings.fsproj"
          CURRENT_VERSION=$(rl_extract_fsproj_version "$FSPROJ")
          echo "Current .fsproj version: $CURRENT_VERSION"

          # Analyze commits
          if [[ "$LAST_TAG" == "$(git rev-list --max-parents=0 HEAD)" ]]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline)
          fi

          if [[ -z "$COMMITS" ]]; then
            echo "::error::No commits since last release. Nothing to release."
            exit 1
          fi

          COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
          echo "Found $COMMIT_COUNT commits since last release"

          # Categorize commits
          BREAKING=$(echo "$COMMITS" | grep -ciE '(BREAKING|!:)' || true)
          FEATURES=$(echo "$COMMITS" | grep -ciE '^[a-f0-9]+ feat' || true)
          FIXES=$(echo "$COMMITS" | grep -ciE '^[a-f0-9]+ fix' || true)

          echo "Breaking: $BREAKING, Features: $FEATURES, Fixes: $FIXES"

          # Determine version. "current"/"staged" ships the CURRENT project version
          # with NO bump (used for the deliberately staged 0.9.0 breaking release, so
          # a BREAKING commit does not auto-bump it to 1.0.0).
          BUMP="${{ inputs.bump }}"
          if [[ "$FIRST_RELEASE" == "true" ]]; then
            NEW_VERSION="$CURRENT_VERSION"
            BUMP_LABEL="initial"
          elif [[ "$BUMP" == "current" || "$BUMP" == "staged" ]]; then
            NEW_VERSION="$CURRENT_VERSION"
            BUMP_LABEL="current (staged)"
            # Validate: current > last tag, and CFF/CHANGELOG already match.
            if ! rl_version_gt "$CURRENT_VERSION" "$LAST_VERSION"; then
              echo "::error::current release requires .fsproj version ($CURRENT_VERSION) > last tag ($LAST_VERSION)."
              exit 1
            fi
            CFF_VERSION=$(awk -F': ' '/^version:/{print $2; exit}' CITATION.cff 2>/dev/null || echo "")
            if [[ -n "$CFF_VERSION" && "$CFF_VERSION" != "$CURRENT_VERSION" ]]; then
              echo "::error::CITATION.cff version ($CFF_VERSION) != .fsproj ($CURRENT_VERSION)."
              exit 1
            fi
            if ! grep -Eq "^## \[$(printf '%s' "$CURRENT_VERSION" | sed 's/\./\\./g')\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$CURRENT_VERSION]' heading to finalize."
              exit 1
            fi
            echo "::notice::Staged release validated: $CURRENT_VERSION (> $LAST_VERSION)"
          elif [[ "$BUMP" == "auto" ]]; then
            if [[ $BREAKING -gt 0 ]]; then
              NEW_VERSION=$(rl_compute_next_version "$CURRENT_VERSION" major)
              BUMP_LABEL="major"
            elif [[ $FEATURES -gt 0 ]]; then
              NEW_VERSION=$(rl_compute_next_version "$CURRENT_VERSION" minor)
              BUMP_LABEL="minor"
            else
              NEW_VERSION=$(rl_compute_next_version "$CURRENT_VERSION" patch)
              BUMP_LABEL="patch"
            fi
          else
            NEW_VERSION=$(rl_compute_next_version "$CURRENT_VERSION" "$BUMP")
            BUMP_LABEL="$BUMP"
          fi

          echo "::notice::Releasing v$NEW_VERSION ($BUMP_LABEL bump)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "first_release=$FIRST_RELEASE" >> "$GITHUB_OUTPUT"
          echo "bump_label=$BUMP_LABEL" >> "$GITHUB_OUTPUT"

          # Save commit data for changelog generation
          echo "$COMMITS" > /tmp/commits.txt
          echo "commits_file=/tmp/commits.txt" >> "$GITHUB_OUTPUT"

      - name: Update .fsproj version
        run: |
          set -euo pipefail
          source scripts/lib/release-lib.sh
          FSPROJ="src/Encodings/Encodings.fsproj"
          CURRENT="${{ steps.version.outputs.current_version }}"
          NEW="${{ steps.version.outputs.new_version }}"
          if [[ "$NEW" == "$CURRENT" ]]; then
            echo "Version already at $NEW (staged release) — no .fsproj change."
          else
            # Portable temp+mv rewrite (parity with scripts/release.sh; no `sed -i`).
            rl_set_fsproj_version "$FSPROJ" "$NEW"
            echo "Updated $FSPROJ: $CURRENT → $NEW"
          fi

      - name: Generate or finalize CHANGELOG entry
        run: |
          set -euo pipefail
          source scripts/lib/release-lib.sh
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          BUMP_LABEL="${{ steps.version.outputs.bump_label }}"
          DATE=$(date +%Y-%m-%d)
          CHANGELOG="CHANGELOG.md"

          # Staged/current: finalize the existing "## [x] - Unreleased" heading
          # (with its curated notes) instead of prepending a generated duplicate.
          if [[ "$BUMP_LABEL" == current* ]]; then
            rl_finalize_changelog "$CHANGELOG" "$NEW_VERSION" "$DATE"
            echo "Finalized staged CHANGELOG heading for v$NEW_VERSION ($DATE)"
            exit 0
          fi

          # Get last tag for commit range
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            LAST_TAG="$(git rev-list --max-parents=0 HEAD)"
          fi

          # Get commits
          if [[ "$LAST_TAG" == "$(git rev-list --max-parents=0 HEAD)" ]]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline)
          fi

          # Categorize
          BREAKING=$(echo "$COMMITS" | grep -iE '(BREAKING|!:)' || true)
          FEATURES=$(echo "$COMMITS" | grep -iE '^[a-f0-9]+ feat' || true)
          FIXES=$(echo "$COMMITS" | grep -iE '^[a-f0-9]+ fix' || true)
          DOCS=$(echo "$COMMITS" | grep -iE '^[a-f0-9]+ docs' || true)
          CHORES=$(echo "$COMMITS" | grep -iE '^[a-f0-9]+ (chore|refactor|ci|test)' || true)

          # Build entry
          ENTRY="## [$NEW_VERSION] - $DATE"$'\n\n'

          if [[ -n "$BREAKING" ]]; then
            ENTRY+="### ⚠ BREAKING CHANGES"$'\n\n'
            while IFS= read -r c; do ENTRY+="- ${c#* }"$'\n'; done <<< "$BREAKING"
            ENTRY+=$'\n'
          fi
          if [[ -n "$FEATURES" ]]; then
            ENTRY+="### ✨ Features"$'\n\n'
            while IFS= read -r c; do ENTRY+="- ${c#* }"$'\n'; done <<< "$FEATURES"
            ENTRY+=$'\n'
          fi
          if [[ -n "$FIXES" ]]; then
            ENTRY+="### 🐛 Bug Fixes"$'\n\n'
            while IFS= read -r c; do ENTRY+="- ${c#* }"$'\n'; done <<< "$FIXES"
            ENTRY+=$'\n'
          fi
          if [[ -n "$DOCS" ]]; then
            ENTRY+="### 📚 Documentation"$'\n\n'
            while IFS= read -r c; do ENTRY+="- ${c#* }"$'\n'; done <<< "$DOCS"
            ENTRY+=$'\n'
          fi
          if [[ -n "$CHORES" ]]; then
            ENTRY+="### 🔧 Maintenance"$'\n\n'
            while IFS= read -r c; do ENTRY+="- ${c#* }"$'\n'; done <<< "$CHORES"
            ENTRY+=$'\n'
          fi

          # Write changelog
          if [[ -f "$CHANGELOG" ]]; then
            HEADER=$(head -n 5 "$CHANGELOG")
            BODY=$(tail -n +6 "$CHANGELOG")
            {
              echo "$HEADER"
              echo ""
              echo "$ENTRY"
              echo "$BODY"
            } > "$CHANGELOG"
          else
            cat > "$CHANGELOG" << EOF
          # Changelog

          All notable changes to FockMap will be documented in this file.

          $ENTRY
          EOF
          fi

          echo "Generated CHANGELOG.md entry for v$NEW_VERSION"

      - name: Update CITATION.cff (version + date, add-or-replace)
        run: |
          set -euo pipefail
          if [[ -f CITATION.cff ]]; then
            source scripts/lib/release-lib.sh
            NEW_VERSION="${{ steps.version.outputs.new_version }}"
            DATE=$(date +%Y-%m-%d)
            # Robust add-or-replace: sets date-released whether present or absent,
            # fails on duplicate/malformed keys, and validates the result parses.
            rl_set_cff_version_and_date CITATION.cff "$NEW_VERSION" "$DATE"
            echo "Updated CITATION.cff to v$NEW_VERSION ($DATE)"
          fi

      - name: Commit release changes
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git add -A
          git commit -m "chore(release): v$NEW_VERSION

          - Update version to $NEW_VERSION
          - Generate CHANGELOG entry
          - Update CITATION.cff

          [automated release]"

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD
          git push origin "$TAG"
          echo "::notice::Pushed tag $TAG — release workflow will now run"

      - name: Summary
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.new_version }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🚀 Release $TAG prepared

          | | |
          |---|---|
          | **Version** | $VERSION |
          | **Tag** | $TAG |
          | **Date** | $(date +%Y-%m-%d) |

          ### Next steps
          The [$TAG push triggers the Release workflow](../actions/workflows/release.yml), which will:
          1. Run multi-platform tests (Linux, Windows, macOS)
          2. Pack and publish to NuGet
          3. Create a GitHub Release

          **Monitor:** \`gh run watch --workflow=release.yml\`
          EOF
