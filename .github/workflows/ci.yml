name: CI

# Linux-only CI on a GitHub-hosted runner so required PR checks are always schedulable.
# (A self-hosted runner can be offline and leave required checks stuck "queued", blocking merges.)
# Multi-platform testing runs on release (see release.yml).
# macOS runners cost 10x, Windows 2x vs Linux on GitHub Actions.

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted Linux: keeps required PR checks schedulable regardless of self-hosted
    # runner availability. This job uses no self-hosted-only features (plain dotnet build/test).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test with coverage
        run: dotnet test --configuration Release --collect:"XPlat Code Coverage" --logger trx

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./**/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 30

      - name: Pack NuGet package
        run: dotnet pack src/Encodings/Encodings.fsproj --configuration Release --no-build -o nupkg

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          retention-days: 30
