name: Release

# Runs the multi-platform validation + publish + GitHub Release for a stable v* tag.
#
# TWO entry points, ONE resolved tag — and BOTH must be TAG refs:
#   * push: tags: v*     — a tag pushed BY A HUMAN OR A PAT triggers this directly.
#   * workflow_dispatch  — the release-dispatch workflow tags with the repo GITHUB_TOKEN,
#                          and a tag pushed with GITHUB_TOKEN does NOT fire `push:` (GitHub
#                          suppresses workflow runs from GITHUB_TOKEN pushes to prevent
#                          recursion). workflow_dispatch/repository_dispatch are the
#                          documented exceptions that DO run with GITHUB_TOKEN, so
#                          release-dispatch hands off explicitly with `--ref <tag>`. Because
#                          it dispatches with --ref <tag>, github.ref_type is `tag` and the
#                          resolver REJECTS any branch dispatch (even a branch sharing the
#                          tag's name), so the run is always pinned to the tag commit.
# Release tags are STABLE-ONLY: vMAJOR.MINOR.PATCH with no leading zeros and no
# pre-release/build metadata (exactly what the release tool emits). The resolve-tag job
# derives a single RELEASE_TAG for both paths; every job checks out / releases that exact
# tag. The test matrix runs on GitHub-hosted Linux (always schedulable) and the online,
# healthy self-hosted macOS ARM64 runner.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag to build & release (vMAJOR.MINOR.PATCH, e.g. v0.9.0). MUST be dispatched with --ref <tag> so every job runs at the tag commit; a branch dispatch is rejected.'
        required: true
        type: string

# Least-privilege default: a read-only token. The only job that mutates the repo
# (create-release) elevates to contents: write at the job level. NuGet publishing uses
# the NUGET_API_KEY secret and artifact upload/download use the run-scoped token, so no
# id-token/packages scopes are required here. This workflow never dispatches anything, so
# it deliberately has NO actions: write (only release-dispatch does).
permissions:
  contents: read

jobs:
  # Single source of truth for the release tag across BOTH triggers. For a push it is the
  # pushed tag; for a dispatch it is the required `tag` input, which must match the
  # dispatched tag ref (github.ref_type=tag, github.ref_name=input). Validates the stable
  # vMAJOR.MINOR.PATCH grammar and that the tag resolves to a real commit, so a wrong/typo
  # tag or a branch dispatch fails fast before anything is published.
  resolve-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the tag ref/objects to verify the tag resolves

      - name: Resolve and validate release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Same helper the release-tool test replays, so push and dispatch resolve
          # identically. Passing github.ref_type lets the resolver REQUIRE a tag ref for
          # both triggers: a workflow_dispatch from a branch (or a same-named branch) is
          # rejected, so the run is always pinned to the tag commit.
          source scripts/lib/release-lib.sh
          TAG="$(rl_resolve_release_tag "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" "$INPUT_TAG")"
          if ! git cat-file -e "refs/tags/${TAG}^{commit}" 2>/dev/null; then
            echo "::error::Release tag $TAG does not resolve to a commit in this repository."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag resolved: $TAG (event: $EVENT_NAME, ref_type: $REF_TYPE)"

  # Test on all platforms before releasing, pinned to the resolved tag.
  # Linux runs on GitHub-hosted ubuntu-24.04: no Linux self-hosted runner is registered
  # (only Windows + macOS self-hosted runners exist), so the former
  # [self-hosted, Linux, X64, buildbeast, podman, release] label set left this leg
  # permanently queued and blocked the release. macOS keeps the online, healthy
  # self-hosted ARM64 runner. Both legs run plain `dotnet build/test` — no
  # podman/self-hosted-only features — so hosted Linux is a drop-in.
  test:
    needs: resolve-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release

  # Build JOSS paper via the reusable draft-paper workflow. Because release-dispatch hands
  # off with `--ref <tag>` (and a human tag push sets github.ref to the tag), this reusable
  # job inherits the tag as github.ref/sha and therefore builds the tag commit.
  papers:
    needs: resolve-tag
    uses: ./.github/workflows/draft-paper.yml

  # Publish NuGet package (parallel with papers, only needs tests).
  # GitHub-hosted Linux so the publish is always schedulable; uses only dotnet plus the
  # NUGET_API_KEY secret (no podman/self-hosted-only commands). Inherits the workflow's
  # read-only token — artifact upload uses the run-scoped token, not contents: write.
  publish-library:
    needs: [resolve-tag, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          source scripts/lib/release-lib.sh
          EXPECTED="$(rl_version_from_tag "$RELEASE_TAG")"
          ACTUAL="$(rl_extract_fsproj_version src/Encodings/Encodings.fsproj)"
          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo "::error::Release tag $RELEASE_TAG implies version $EXPECTED but .fsproj is $ACTUAL."
            exit 1
          fi
          echo "::notice::Package version $ACTUAL matches release tag $RELEASE_TAG"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Pack NuGet package
        run: dotnet pack src/Encodings/Encodings.fsproj --configuration Release --no-build -o nupkg

      - name: Publish to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-release
          path: nupkg/*.nupkg
          retention-days: 30

  # Create GitHub Release with all artifacts.
  # GitHub-hosted Linux so release creation is always schedulable. This is the only job
  # that writes to the repo, so it elevates to contents: write (above the workflow's
  # read-only default) for softprops/action-gh-release; it just downloads artifacts. The
  # release is pinned to the resolved tag (tag_name) so push and dispatch are identical and
  # idempotent — re-running for the same tag updates the one release, never creates a second.
  create-release:
    needs: [resolve-tag, publish-library, papers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package-release
          path: artifacts/

      - name: Download JOSS paper
        uses: actions/download-artifact@v8
        with:
          name: joss-paper
          path: artifacts/

      - name: Rename paper PDFs
        run: |
          mv artifacts/paper.pdf artifacts/fockmap-joss.pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: |
            artifacts/*.nupkg
            artifacts/fockmap-joss.pdf
