name: Release

# Multi-platform validation before release, triggered by a v* tag push.
# The test matrix runs on GitHub-hosted Linux (always schedulable) and the online,
# healthy self-hosted macOS ARM64 runner, preserving cross-platform coverage.

on:
  push:
    tags:
      - 'v*'

# Least-privilege default: a read-only token. The only job that mutates the repo
# (create-release) elevates to contents: write at the job level. NuGet publishing uses
# the NUGET_API_KEY secret and artifact upload/download use the run-scoped token, so no
# id-token/packages scopes are required here.
permissions:
  contents: read

jobs:
  # Test on all platforms before releasing.
  # Linux runs on GitHub-hosted ubuntu-24.04: no Linux self-hosted runner is registered
  # (only Windows + macOS self-hosted runners exist), so the former
  # [self-hosted, Linux, X64, buildbeast, podman, release] label set left this leg
  # permanently queued and blocked the tag-triggered release. macOS keeps the online,
  # healthy self-hosted ARM64 runner. Both legs run plain `dotnet build/test` — no
  # podman/self-hosted-only features — so hosted Linux is a drop-in.
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release

  # Build JOSS paper via the reusable draft-paper workflow
  papers:
    uses: ./.github/workflows/draft-paper.yml

  # Publish NuGet package (parallel with papers, only needs tests).
  # GitHub-hosted Linux so the publish is always schedulable; uses only dotnet plus the
  # NUGET_API_KEY secret (no podman/self-hosted-only commands). Inherits the workflow's
  # read-only token — artifact upload uses the run-scoped token, not contents: write.
  publish-library:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Pack NuGet package
        run: dotnet pack src/Encodings/Encodings.fsproj --configuration Release --no-build -o nupkg

      - name: Publish to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-release
          path: nupkg/*.nupkg
          retention-days: 30

  # Create GitHub Release with all artifacts.
  # GitHub-hosted Linux so release creation is always schedulable. This is the only job
  # that writes to the repo, so it elevates to contents: write (above the workflow's
  # read-only default) for softprops/action-gh-release; it just downloads artifacts.
  create-release:
    needs: [publish-library, papers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package-release
          path: artifacts/

      - name: Download JOSS paper
        uses: actions/download-artifact@v8
        with:
          name: joss-paper
          path: artifacts/

      - name: Rename paper PDFs
        run: |
          mv artifacts/paper.pdf artifacts/fockmap-joss.pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.nupkg
            artifacts/fockmap-joss.pdf
